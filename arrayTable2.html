<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Easy Array to Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>
    <h1>Easy Array to Table</h1>
    <p>This simple page turns a list of friends into a table.</p>
    <table id="friends-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        // now using nested arrays: [name, age]
        const friends = [
            ['Alice', 25],
            ['Bob', 30],
            ['Carol', 28]
        ];

        function populateTable(arr) {
            const tbody = document.querySelector('#friends-table tbody');

            if (arr.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2">No data available.</td></tr>';
                return;
            }

            // tbody.innerHTML = arr
            //     .map(item => {
            //         const name = item[0] ?? '';
            //         const age = item[1] ?? '';
            //         return '<tr><td>' + name + '</td><td>' + age + '</td></tr>';
            //     })
            //     .join('');

            let html = '';
            for (let i = 0; i < arr.length; i++) {
                const name = arr[i][0] ?? '';
                const age = arr[i][1] ?? '';
                html += '<tr><td>' + name + '</td><td>' + age + '</td></tr>';
            }
            tbody.innerHTML = html;
        }

        populateTable(friends);
    </script>
</body>

</html>
