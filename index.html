<body>
    <h1>Simple Calculator</h1>
    <div>
        <label>Number 1: <input type="number" id="value1"></label>
    </div>
    <div>
        <label>Number 2: <input type="number" id="value2"></label>
    </div>
    <div>
        <label>Operation:
            <select id="operation">
                <option value="add">+</option>
                <option value="subtract">-</option>
                <option value="multiply">*</option>
                <option value="divide">/</option>
            </select>
        </label>
    </div>
    <div>
        <button type="button" onclick="calculate()">Calculate</button>
    </div>
    <div>
        Result: <span id="result">0</span>
    </div>
    <script>
        function calculate() {
            const a = parseFloat(document.getElementById('value1').value);
            const b = parseFloat(document.getElementById('value2').value);
            const op = document.getElementById('operation').value;
            let result;

            if (Number.isNaN(a) || Number.isNaN(b)) {
                result = 'Please enter valid numbers.';
            } else {
                switch (op) {
                    case 'add':
                        result = a + b;
                        break;
                    case 'subtract':
                        result = a - b;
                        break;
                    case 'multiply':
                        result = a * b;
                        break;
                    case 'divide':
                        result = b === 0 ? 'Cannot divide by zero' : a / b;
                        break;
                }
            }

            document.getElementById('result').textContent = result;
        }
    </script>
</body>

</html>
